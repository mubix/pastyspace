<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161c">
<meta name="description" content="PastySpace: your clipboard, with a URL. Paste text, code, screenshots or files, save once, and share the link.">
<title>{% block title %}PastySpace{% endblock %}</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/favicon-32.png') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/apple-touch-icon.png') }}">
<link rel="preload" href="{{ url_for('static', filename='fonts/bricolage-grotesque.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}" aria-label="PastySpace home">
    <img src="{{ url_for('static', filename='brand/favicon.svg') }}" width="40" height="40" alt="">
    <b>Pasty<span>Space</span></b>
  </a>
  <nav aria-label="Main navigation">
    <a class="btn btn-primary" href="{{ url_for('new') }}">+ New paste</a>
  </nav>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <span>A little space for your paste.</span>
  <a href="https://mubix.github.io/pastyspace/" target="_blank" rel="noopener noreferrer">About PastySpace<span class="sr-only"> (opens in a new tab)</span></a>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2200);
}
function humanSize(n) {
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
}
async function copyText(s, label) {
  try { await navigator.clipboard.writeText(s); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast((label || 'Copied') + ' to clipboard');
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
